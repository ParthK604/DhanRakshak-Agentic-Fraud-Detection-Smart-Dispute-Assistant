# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# The production API is an existing Render web service managed from this Blueprint.
services:
  # This service runs the FastAPI backend from the backend subdirectory.
  - type: web
    name: dhanrakshak-agentic-fraud-detection
    runtime: python
    rootDir: backend
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Render supplies the selected Python runtime to the build.
      - key: PYTHON_VERSION
        value: 3.13.2
      # PayPal sandbox credentials are prompted for and never stored in Git.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      # MongoDB connection credentials are prompted for and never stored in Git.
      - key: MONGO_URI
        sync: false
      - key: MONGODB_DB
        value: dhanrakshak
      # Groq credentials are prompted for and the model is a non-secret default.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Browser access is limited to the deployed Vercel app and local development.
      - key: CORS_ORIGINS
        value: https://dhan-rakshak-agentic-fraud-detectio.vercel.app,http://localhost:3000
      # Production uses live merchant research and prepared dispute fallback by default.
      - key: MERCHANT_RESEARCH_MODE
        value: live
      - key: DISPUTE_SUBMISSION_MODE
        value: prepared
      - key: ENABLE_DEV_ENDPOINTS
        value: "false"
      # These bounded controls protect the free instance and shared AI quota.
      - key: HEALTH_CACHE_SECONDS
        value: "45"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"

